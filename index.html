<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knight Kingdom — Discord сервер</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(88, 101, 242, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(88, 101, 242, 0.1) 0%, transparent 50%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .container {
            max-width: 1400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Баннер */
        .banner {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.03);
            min-height: 250px;
        }

        .banner img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            max-height: 350px;
            min-height: 250px;
        }

        .banner-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px;
            background: linear-gradient(to top, rgba(10, 10, 15, 0.95) 0%, transparent 100%);
        }

        .banner-overlay h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #5865F2, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .banner-overlay p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            max-width: 700px;
            line-height: 1.6;
        }

        /* Шапка */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .server-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(88, 101, 242, 0.6);
            box-shadow: 0 0 25px rgba(88, 101, 242, 0.4);
            flex-shrink: 0;
            background: #0a0a0f;
            position: relative;
        }

        .server-avatar iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
            transform: scale(1.3);
        }

        .header-info h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header-info .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #23a55a;
            box-shadow: 0 0 10px rgba(35, 165, 90, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .invite-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #5865F2;
            color: #fff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.4);
        }

        .invite-btn:hover {
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(88, 101, 242, 0.6);
        }

        .invite-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Основной контент */
        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            width: 100%;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .widget-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .widget-container iframe {
            border-radius: 16px;
            width: 100%;
            border: none;
        }

        /* ===== СТАТИСТИКА ===== */
        .stats-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .stats-title {
            font-size: 2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 14px;
            padding-left: 5px;
            background: linear-gradient(135deg, #ffffff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats-title svg {
            width: 36px;
            height: 36px;
            fill: #5865F2;
            -webkit-text-fill-color: initial;
            flex-shrink: 0;
        }

        /* Прямоугольные карточки: 2 колонки */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 700px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .chart-card:hover {
            transform: translateY(-4px);
            border-color: rgba(88, 101, 242, 0.4);
            box-shadow: 0 12px 40px rgba(88, 101, 242, 0.15);
        }

        .chart-card .chart-label {
            font-size: 1rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-card .chart-label .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 12px currentColor;
        }

        /* Прямоугольная область графика: широкая и невысокая */
        .chart-card .chart-wrapper {
            width: 100%;
            height: 220px; /* прямоугольник ~ ширина × 220 */
            border-radius: 14px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.25);
        }

        .chart-card .chart-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Футер */
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 20px;
        }

        .footer a {
            color: #5865F2;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #a78bfa;
        }

        @media (max-width: 500px) {
            .banner-overlay h1 {
                font-size: 1.6rem;
            }
            .banner-overlay p {
                font-size: 0.85rem;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .invite-btn {
                width: 100%;
                justify-content: center;
            }
            .stats-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Баннер -->
        <div class="banner glass">
            <img src="https://s6.iimage.su/s/10/gTdCEfUx8zd0chvUVrDunKcnPu0P1flEdhcuYln6M.jpg" 
                 alt="Knight Kingdom Banner"
                 onerror="this.style.display='none'; this.parentElement.style.minHeight='250px'; this.parentElement.style.background='linear-gradient(135deg, #1a1a2e, #16213e, #0f3460)';">
            <div class="banner-overlay">
                <h1>Knight Kingdom</h1>
                <p>Королевство для дружеского общения. Тёплая атмосфера, интересные беседы и активное сообщество. Ценим уважение, юмор и взаимопомощь.</p>
            </div>
        </div>

        <!-- Шапка -->
        <div class="header glass">
            <div class="header-left">
                <div class="server-avatar">
                    <iframe src="https://giphy.com/embed/bg7bVg8sSMiZFo1Ojg" 
                            frameborder="0" 
                            allowfullscreen
                            loading="lazy">
                    </iframe>
                </div>
                <div class="header-info">
                    <h2>Knight Kingdom</h2>
                    <div class="status">
                        <span class="status-dot"></span>
                        <span id="online-count">Загрузка...</span>
                    </div>
                </div>
            </div>
            <a href="https://discord.gg/eYDYJFHSyZ" target="_blank" rel="noopener" class="invite-btn">
                <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                Присоединиться
            </a>
        </div>

        <!-- Основной контент -->
        <div class="main-grid">

            <!-- Левая колонка -->
            <div class="sidebar">
                <div class="widget-container glass">
                    <iframe src="https://discord.com/widget?id=1224785949909716992&theme=dark" 
                            width="350" 
                            height="500" 
                            allowtransparency="true" 
                            frameborder="0" 
                            sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
                    </iframe>
                </div>
            </div>

            <!-- Правая колонка: статистика -->
            <div class="stats-section">
                <div class="stats-title">
                    <svg viewBox="0 0 24 24"><path d="M3 3v18h18v-2H5V3H3zm4 14h2V9H7v8zm4 0h2V5h-2v12zm4 0h2v-6h-2v6z"/></svg>
                    Статистика сервера
                </div>

                <div class="stats-grid">
                    <div class="chart-card glass">
                        <div class="chart-label">
                            <span class="dot" style="background: #5865F2; color: #5865F2;"></span>
                            Участники
                        </div>
                        <div class="chart-wrapper">
                            <iframe loading="lazy" 
                                    src="https://a.discordserver.info/1224785949909716992/widgets/chart/users" 
                                    style="width: 100%; height: 100%; border: none;">
                            </iframe>
                        </div>
                    </div>

                    <div class="chart-card glass">
                        <div class="chart-label">
                            <span class="dot" style="background: #23a55a; color: #23a55a;"></span>
                            Активность
                        </div>
                        <div class="chart-wrapper">
                            <iframe loading="lazy" 
                                    src="https://a.discordserver.info/1224785949909716992/widgets/chart/activity" 
                                    style="width: 100%; height: 100%; border: none;">
                            </iframe>
                        </div>
                    </div>

                    <div class="chart-card glass">
                        <div class="chart-label">
                            <span class="dot" style="background: #f0b232; color: #f0b232;"></span>
                            Сообщения
                        </div>
                        <div class="chart-wrapper">
                            <iframe loading="lazy" 
                                    src="https://a.discordserver.info/1224785949909716992/widgets/chart/messages" 
                                    style="width: 100%; height: 100%; border: none;">
                            </iframe>
                        </div>
                    </div>

                    <div class="chart-card glass">
                        <div class="chart-label">
                            <span class="dot" style="background: #eb459e; color: #eb459e;"></span>
                            Онлайн
                        </div>
                        <div class="chart-wrapper">
                            <iframe loading="lazy" 
                                    src="https://a.discordserver.info/1224785949909716992/widgets/chart/online" 
                                    style="width: 100%; height: 100%; border: none;">
                            </iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            © 2026 Knight Kingdom • <a href="https://discord.gg/eYDYJFHSyZ" target="_blank" rel="noopener">Присоединиться к серверу</a>
        </div>
    </div>

    <script>
        (async function loadStats() {
            try {
                const response = await fetch('https://discord.com/api/guilds/1224785949909716992/widget.json');
                if (!response.ok) throw new Error('Ошибка загрузки');
                const data = await response.json();
                
                const onlineEl = document.getElementById('online-count');
                if (data.presence_count !== undefined) {
                    onlineEl.textContent = `${data.presence_count} онлайн`;
                } else {
                    onlineEl.textContent = 'Статистика доступна';
                }

                if (data.name) {
                    document.querySelector('.header-info h2').textContent = data.name;
                }
            } catch (error) {
                console.warn('Не удалось загрузить статистику:', error);
                document.getElementById('online-count').textContent = 'Сервер активен';
            }
        })();

        document.querySelector('.banner img').addEventListener('error', function() {
            this.style.display = 'none';
            this.parentElement.style.minHeight = '250px';
            this.parentElement.style.background = 'linear-gradient(135deg, #1a1a2e, #16213e, #0f3460)';
        });
    </script>

</body>
</html>
